<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 650px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.6;
      color: #333;
    }
    img {
      max-width: 100%;
      height: auto;
      border-radius: 12px;
      margin: 20px 0;
    }
    .links a {
      display: inline-block;
      margin-right: 15px;
      margin-bottom: 10px;
      padding: 8px 16px;
      background-color: #f0f0f0;
      color: #000;
      text-decoration: none;
      border-radius: 6px;
    }
    .links a:hover {
      background-color: #e0e0e0;
    }
  </style>
</head>
<body>

  <h1>Hi, I'm Alex! 👋</h1>
  <p>Welcome to my personal page. I love photography, coding, and building things on the web.</p>

  <!-- Replace profile.jpg with your uploaded image filename -->
  <img src="profile.jpg" alt="Profile photo">

  <h2>Connect with me</h2>
  <div class="links">
    <a href="https://twitter.com/yourusername" target="_blank">Twitter / X</a>
    <a href="https://linkedin.com/in/yourusername" target="_blank">LinkedIn</a>
    <a href="https://github.com/yourusername" target="_blank">GitHub</a>
  </div>

  <h2>Contact</h2>
  <p>Email: <a href="mailto:yourname@email.com">yourname@email.com</a></p>

</body>
</html>
